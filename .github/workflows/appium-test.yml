
name: Appium UI Tests

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  timeline-test:
    runs-on: [self-hosted, macOS, ARM64]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check Android device
        run: adb devices

      - name: Run Timeline UI test
        run: npm run test:timeline